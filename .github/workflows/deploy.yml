name: Build and deploy Agency Roles

on:
  schedule:
    - cron: "0 12 * * *"      # daily ~08:00 ET / 05:00 PT
  workflow_dispatch: {}         # lets you trigger a run by hand
  push:
    branches: [ main ]

permissions:
  contents: write               # to commit refreshed data
  pages: write                  # to publish
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl agencies and build the site
        run: python3 crawl_and_build.py

      - name: Commit refreshed listings
        run: |
          git config user.name "agency-roles-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git commit -m "Refresh listings ($(date -u +%F))" || echo "no changes to commit"
          git push || echo "nothing to push"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
