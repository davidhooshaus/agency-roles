name: Build and deploy Agency Roles

on:
  schedule:
    - cron: "0 12 * * *"      # daily ~08:00 ET / 05:00 PT
  workflow_dispatch: {}         # lets you trigger a run by hand
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write                  # to publish
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Carry first-seen dates across runs (powers "New" badges) without
      # committing anything back to the repo — avoids history divergence.
      - name: Restore first-seen history
        uses: actions/cache@v4
        with:
          path: data/history.json
          key: history-${{ github.run_id }}
          restore-keys: |
            history-

      - name: Crawl agencies and build the site
        run: python3 crawl_and_build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
